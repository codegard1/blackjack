# Netlify build and deploy settings. Secrets never live here: environment variables
# declared in this file are not available to functions, so MONGODB_URI and
# MONGODB_DB are set in the Netlify UI (Site configuration > Environment variables).

[dev]
  targetPort = 3000
  port = 8888

[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Serve the single page app for every path. Functions declare their own paths
# (for example /api/profiles) and are matched before this rewrite.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security headers for all static responses.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000; includeSubDomains"
    Content-Security-Policy = "default-src 'self'; script-src 'self' https://accounts.google.com; style-src 'self' 'unsafe-inline' https://accounts.google.com; img-src 'self' data: https://*.googleusercontent.com; connect-src 'self' https://accounts.google.com; frame-src https://accounts.google.com; worker-src 'self'; manifest-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'"

# Never cache the service worker or its workbox runtime, so updates ship immediately.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/workbox-*.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
