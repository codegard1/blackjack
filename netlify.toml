# Netlify build and deploy settings. Secrets never live here: environment variables
# declared in this file are not available to functions, so MONGODB_URI and
# MONGODB_DB are set in the Netlify UI (Site configuration > Environment variables).

[dev]
  targetPort = 3000
  port = 8888

[build]
  command = "npm run build"
  publish = "dist"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

# Serve the single page app for every path. Functions declare their own paths
# (for example /api/profiles) and are matched before this rewrite.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Never cache the service worker or its workbox runtime, so updates ship immediately.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

[[headers]]
  for = "/workbox-*.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
